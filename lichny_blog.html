<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        header{
            background-color: bisque;
            box-shadow: 2 2px 2px rgba(0, 0, 0, 0.1);
        }
        .articles-container{
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        article{
            padding: 20px;
            border-radius: 13px;
            width: 100px;
            height: 100px;
            box-shadow: 2 2px 2px rgba(0, 0, 0, 0.1);
            margin: 10px;
            flex: 1;
            min-width: 250px;
        }
        .aside {
            flex: 1;
            background-color: #4CAF50;
            color: white;
            padding: 20px;
        }

        .aside-content {
            margin-bottom: 20px;
        }
        /* Медиа-запрос для мобильных устройств */
        @media (max-width: 768px) {
        .header nav {
            flex-direction: column;
            gap: 10px;
        }

        .articles {
            flex-direction: column;
        }

        .aside {
            width: 100%;
            max-height: 200px;
            overflow: hidden;
        }

        .card {
            width: 100%;
        }
    }
    </style>
</head>
<body>
    <header>
        <p>Мой личный блог</p>
        <nav>
            <a href="/">Главная</a>
            <a href="/state">Статьи</a>
            <a href="/my">Обо мне</a>
        </nav>
    </header>
    <main>
        <div class="articles-container">
        <article>
            <h2>Статья номер 1 </h2>
            <p>28.09.2026</p>
            <p>Тут текст статьи</p>
        </article>
        <article>
            <h2>Статья номер 2</h2>
            <p>10.10.2026</p>
            <p>Тут текст статьи</p>
        </article>
        <article>
            <h2>Статья номер 3</h2>
            <p>14.10.2026</p>
            <p>Тут текст статьи</p>
        </article>
        </div>
    </main>
    <aside class="aside">
        <div class="aside-content">
        <h2>Теги</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>
        </div>
    </aside>
    <footer>
        <p>&copy; 2026 Мой личный блог</p>
    </footer>
</body>
</html>
