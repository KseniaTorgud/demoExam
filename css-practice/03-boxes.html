<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * { box-sizing: border-box; }
        .box1{
            padding: 10px;
            border: 2px solid;
            margin-bottom: 20px;
        }
        .box2{
            padding: 20px;
            border: 2px solid;
            margin-bottom: 20px;
        }
        .box3{
            padding: 40px;
            border: 2px solid;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <main>
        <div class="box1">
            <p>Тут будет небольшой текст</p>
        </div>
        <div class="box2">
            <p>Тут будет небольшой текст</p>
        </div>
        <div class="box3">
            <p>Тут будет небольшой текст</p>
        </div>
    </main>
</body>
</html>
