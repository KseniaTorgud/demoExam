<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>галерея без media-запросов</title>
    <style>
        .gallery{
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        article{
            flex: 1 1 280px;
            margin: 9px;
            padding: 15px;
        }
        nav{
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        header{
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
        }
        @media (max-width: 600px){ 
            .header{
                display: flex;
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>LOGO</h1>
        <nav>
            <a href="/katalog">Каталог</a>
            <a href="/korzina">Корзина</a>
            <a href="/profil">Профиль</a>
        </nav>
    </header>
    <main>
        <h2>Основное меню</h2>
        <div class="gallery">
        <article>
            <h2>Товар 1</h2>
            <p>1200</p>
            <button>Купить</button>
        </article>

        <article>
            <h2>Товар 2</h2>
            <p>2200</p>
            <button>Купить</button>
        </article>

        <article>
            <h2>Товар 3</h2>
            <p>500</p>
            <button>Купить</button>
        </article>

        <article>
            <h2>Товар 4</h2>
            <p>1000</p>
            <button>Купить</button>
        </article>

        <article>
            <h2>Товар 5</h2>
            <p>1000</p>
            <button>Купить</button>
        </article>

        <article>
            <h2>Товар 6</h2>
            <p>1000</p>
            <button>Купить</button>
        </article>
        </div>
    </main>
</body>
</html>
