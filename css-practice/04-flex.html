<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gallery{
            flex-wrap: wrap;
            gap: 20px;
        }
        .card{
            flex: 1 1 250px;
            padding: 20px;
            border: 2px solid #1c1c1c;
            border-radius: 15px;
            box-shadow: 0 4px 8px #858585;
            margin: 20px;
        }
        .card:hover{
            transform: scale(1.05);
            cursor: pointer;
        }
        .header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: blanchedalmond;
        }
        
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">Логотип</div>
        <nav class="nav">
        <a href="#">Главная</a>
        <a href="#">О нас</a>
        <a href="#">Контакты</a>
    </nav>
    </header>
    <main>
        <div class="gallery">
            <div class="card">Товар 1</div>
            <div class="card">Товар 2</div>
            <div class="card">Товар 3</div>
            <div class="card">Товар 4</div>
        </div>
    </main>
</body>
</html>
