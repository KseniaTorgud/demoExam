<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Конференции.РФ</title>
</head>
<body>
    <header>
        <h1>Регистрация</h1>
    </header>
    <main>
        <form action="register.php" method="post">
            <label for="login">Логин</label>
            <input id="login" type="text" data-testid="reg-login" name="login" required>

            <label for="password">Пароль</label>
            <input id="password" type="password" data-testid="reg-password" name="password" required>

            <label for="fullname">ФИО</label>
            <input id="fullname" type="text" data-testid="reg-fullname" name="fullname" required>

            <label for="phone">Телефон</label>
            <input id="phone" type="tel" data-testid="reg-phone" name="phone" required>

            <label for="email">Email</label>
            <input id="email" type="email" data-testid="reg-email" name="email" required>

            <label for="birthdate">Дата рождения</label>
            <input id="birthdate" type="date" name="birthdate">

            <fieldset>
                <legend>Пол</legend>
                <label><input type="radio" name="gender" value="male"> Мужской</label>
                <label><input type="radio" name="gender" value="female"> Женский</label>
            </fieldset>

            <label>
                <input type="checkbox" name="terms" required>
                Я принимаю условия использования
            </label>

            <button type="submit" data-testid="reg-submit">Создать пользователя</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Конференции.РФ</p>
    </footer>
</body>
</html>
